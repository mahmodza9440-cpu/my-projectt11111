<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>
<body>
<script>
// 1. Student Class
class Student {
    constructor(id, name, grades, attendance) {
        this.id = id;
        this.name = name;
        this.grades = grades;
        this.attendance = attendance;
    }
    // 2. Calculate Average using reduce
    calculateAverage() {
        let total = this.grades.reduce((sum, grade) => sum + grade, 0);
        return total / this.grades.length;
    }
    // 3. Get Academic Grade
    getGrade() {
        let average = this.calculateAverage();
        if (average >= 90) {
            return "A";
        } else if (average >= 80) {
            return "B";
        } else if (average >= 70) {
            return "C";
        } else if (average >= 60) {
            return "D";
        } else if (average >= 50) {
            return "E";
        } else {
            return "F";
        }
    }
    // 4. Get Final Result
    getResult() {
        if (this.calculateAverage() >= 50 && this.attendance >= 75) {
            return "ناجح";
        } else {
            return "يحتاج مراجعة";
        }
    }
}
// 5. Main Students Array
let studentsList = [
    new Student(1, "Ahmed", [90, 85, 95], 90),
    new Student(2, "Mona", [45, 48, 42], 80),
    new Student(3, "Ali", [70, 75, 80], 85),
    new Student(4, "Sara", [40, 45, 48], 70)
];
// 6. Filter Struggling Students
let strugglingStudents = studentsList.filter(student => {
    let average = student.calculateAverage();
    return average >= 40 && average <= 49;
});
// 7. Add 5 Mercy Marks using map
let mercyStudents = strugglingStudents.map(student => {
    return {
        id: student.id,
        name: student.name,
        oldAverage: student.calculateAverage(),
        newAverage: student.calculateAverage() + 5
    };
});
// 8. Calculate Total New Averages using reduce
let totalNewAverages = mercyStudents.reduce((total, student) => {
    return total + student.newAverage;
}, 0);
// 9. Calculate Mercy Average with Zero Protection
let mercyAverage = mercyStudents.length > 0
    ? totalNewAverages / mercyStudents.length
    : 0;
// 10. Print Students Reports
console.log("===== Students Report =====");
studentsList.forEach(student => {
    console.log("Student ID:", student.id);
    console.log("Name:", student.name);
    console.log("Average:", student.calculateAverage());
    console.log("Grade:", student.getGrade());
    console.log("Result:", student.getResult());
    console.log("--------------------------");
});
// 11. Print Mercy Students
console.log("===== Mercy Students =====");
console.log(mercyStudents);
// 12. Print Mercy Average
console.log("Mercy Average:", mercyAverage);
</script>
</body>
</html>
